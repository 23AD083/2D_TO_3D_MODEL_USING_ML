<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint 3D Model Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px 2px;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3>Blueprint 3D Viewer</h3>
        <p><strong>Controls:</strong></p>
        <p>• Left Click + Drag: Rotate</p>
        <p>• Right Click + Drag: Pan</p>
        <p>• Scroll: Zoom</p>
        <p>• F: Toggle First-Person</p>
        <hr>
        <button onclick="toggleWireframe()">Toggle Wireframe</button>
        <button onclick="resetCamera()">Reset View</button>
        <button onclick="centerModel()">Center Model</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        let scene, camera, renderer, controls, model;
        let wireframeMode = false;
        let firstPersonMode = false;
        
        // Initialize scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        
        // Add ambient light
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        
        // Add directional lights
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(10, 10, 5);
        scene.add(dirLight1);
        
        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight2.position.set(-10, -10, -5);
        scene.add(dirLight2);
        
        // Camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);
        
        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Controls
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();
        
        // Load model
        const loader = new THREE.GLTFLoader();
        loader.load('../output/model.glb', 
            function(gltf) {
                model = gltf.scene;
                scene.add(model);
                
                // Calculate bounding box and center
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                // Center the model
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;
                
                // Adjust camera to fit model
                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
                controls.update();
                
                console.log('Model loaded successfully');
            },
            function(progress) {
                console.log('Loading:', (progress.loaded / progress.total * 100) + '%');
            },
            function(error) {
                console.error('Error loading model:', error);
                alert('Failed to load model.glb. Make sure you ran the conversion first.');
            }
        );
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Window resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Keyboard controls
        document.addEventListener('keydown', function(event) {
            if (event.key === 'f' || event.key === 'F') {
                toggleFirstPerson();
            }
        });
        
        // Functions
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            if (model) {
                model.traverse(function(child) {
                    if (child.isMesh) {
                        child.material.wireframe = wireframeMode;
                    }
                });
            }
        }
        
        function resetCamera() {
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
                camera.lookAt(0, 0, 0);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }
        
        function centerModel() {
            if (model) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.x = -center.x;
                model.position.y = -center.y;
                model.position.z = -center.z;
            }
        }
        
        function toggleFirstPerson() {
            firstPersonMode = !firstPersonMode;
            if (firstPersonMode) {
                controls.enableRotate = false;
                controls.enablePan = false;
                controls.enableZoom = false;
            } else {
                controls.enableRotate = true;
                controls.enablePan = true;
                controls.enableZoom = true;
            }
        }
    </script>
</body>
</html>
